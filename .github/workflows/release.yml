# RELEASE — migrate, THEN deploy. The order is still the whole point; what
# changed is WHERE the migration runs.
#
# A deploy that ships code before its schema runs new code against an old
# database: it looks healthy and writes to columns that may not exist. A deploy
# that migrates first, and STOPS if the migration fails, leaves the previous
# container serving — which is the correct outcome, because a working old
# version beats a broken new one.
#
# THIS JOB USED TO RUN THE MIGRATION ITSELF, AND COULD NOT HAVE.
#
# It called `npm run migrate:up` on the GitHub runner using DB_HOST from
# secrets. That host is `mysql.railway.internal`, and Railway's private network
# is not reachable from outside Railway — the MySQL service exposes no TCP proxy
# (no RAILWAY_TCP_PROXY_* variables on it), so there is no public address to
# reach it on at all. Every DB step here could only ever fail with
# `getaddrinfo ENOTFOUND mysql.railway.internal`, before touching the database.
#
# Which means the guarantee in the header was never held: the deploy step below
# was gated on a migration that had not run. Worse, it fails in the direction
# that LOOKS safe — the job goes red, so nobody sees a bad deploy; they see a
# broken pipeline, and the schema quietly stays behind.
#
# So the migration moved to `railway.json`'s `preDeployCommand`, which Railway
# runs INSIDE the private network, once per deploy, before the new revision
# takes traffic. Identical semantics, from somewhere that can actually connect:
#
#   - fails the deploy if the migration fails, old container keeps serving
#   - runs ONCE per deploy, not per replica, so no concurrent DDL
#   - runs against the environment being deployed to, not one named by a secret
#     that can silently point somewhere else
#
# The replica race is still handled, and now more directly: preDeploy is a
# single execution by definition, whereas this job relied on `concurrency` to
# stop two runs overlapping.
#
# WHAT STILL BELONGS HERE: the environment approval gate, and the deploy.
name: Release

on:
  push:
    branches: [develop]        # -> staging
  release:
    types: [published]         # -> production (a tagged, deliberate act)
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]

concurrency:
  # Never two releases to the same environment at once. Still wanted: two
  # overlapping deploys race each other's preDeploy migrations just as two
  # overlapping migrate jobs used to.
  group: release-${{ github.event.inputs.environment || (github.event_name == 'release' && 'production' || 'staging') }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      # Production should carry a required reviewer in the repo's Environments
      # settings. That approval gate is the difference between "promoted" and
      # "whatever merged last".
      name: ${{ github.event.inputs.environment || (github.event_name == 'release' && 'production' || 'staging') }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # A migration is the one deploy step that cannot be undone by redeploying
      # the previous image. The reminder stays, and stays before the deploy that
      # triggers the migration rather than before a step that never ran.
      - name: Backup reminder
        if: ${{ github.event_name == 'release' }}
        run: |
          echo "::warning::Production deploy — this runs pending migrations via preDeployCommand. Confirm a database snapshot exists."

      # Railway runs `npm run migrate:up` (railway.json → deploy.preDeployCommand)
      # before this revision receives traffic. A failing migration fails the
      # deploy and the previous container keeps serving.
      - name: Deploy
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN not set — nothing deployed."
            exit 1
          fi
          npm i -g @railway/cli
          railway redeploy --service core --yes --from-source

      # Verifying the schema from here would need database access this runner
      # does not have. The equivalent check now lives in the service itself:
      # boot logs "!!! PENDING MIGRATIONS !!!" if the revision is running
      # against an older schema, and GET /v1/health reports db reachability.
